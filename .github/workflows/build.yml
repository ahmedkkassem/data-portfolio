name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"   # daily 06:15 UTC
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt anthropic
      - name: Cache raw retail file (static source, 45 MB)
        uses: actions/cache@v4
        with:
          path: data/raw/retail
          key: retail-raw-v1
      - name: Extract retail
        run: python pipelines/retail/extract.py
      - name: Transform + test (dbt build)
        working-directory: .
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt || true
          dbt build --project-dir dbt --profiles-dir dbt --exclude tag:sheets tag:nyc311
      - name: Independent reconciliation
        run: python checks/reconcile_retail.py
      - name: Export dashboard data
        if: always()
        run: python pipelines/export/retail.py
      - name: Spreadsheet rescue (make messy files, clean them, prove the rebuild is exact)
        run: |
          python pipelines/spreadsheets/make_messy.py
          python pipelines/spreadsheets/clean.py
          dbt build --project-dir dbt --profiles-dir dbt --select tag:sheets
          cp dbt/target/run_results.json build/checks/run_results_sheets.json
          python pipelines/export/sheets.py
      - name: Restore NYC 311 pipeline state (GitHub Release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pipeline-state -p '*.parquet' -D data/state || echo "no saved state yet; this run backfills"
      - name: Extract + load NYC 311 (incremental upsert)
        run: python pipelines/nyc311/extract_load.py
      - name: Transform + test NYC 311 (dbt build + source freshness)
        run: |
          dbt build --project-dir dbt --profiles-dir dbt --select tag:nyc311
          cp dbt/target/run_results.json build/checks/run_results_nyc311.json
          dbt source freshness --project-dir dbt --profiles-dir dbt --select source:nyc311.nyc311_requests \
            --output build/checks/nyc311_sources.json || echo "freshness threshold breached; shown on the page"
          python pipelines/export/nyc311.py
      - name: Save NYC 311 pipeline state (only after tests pass)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pipeline-state >/dev/null 2>&1 || gh release create pipeline-state \
            --title "Pipeline state (NYC 311)" \
            --notes "Machine-written state for the daily NYC 311 pipeline (Parquet). Not a software release."
          gh release upload pipeline-state data/state/nyc311_requests.parquet data/state/nyc311_runs.parquet --clobber
      - name: Weekly AI summary (only with an API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipelines/summary/generate.py
      - name: Number guard (every figure in the summary must trace to a fact)
        run: python checks/number_guard.py
      - name: Assemble site
        run: |
          cp -R site/. build/site/
          cp build/checks/number_guard.json build/site/data/number_guard.json
          touch build/site/.nojekyll
      - name: Screenshots (headless Chrome)
        run: bash tools/screenshot.sh
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/
            dbt/target/run_results.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
