name: v2 trial (one-off)
# Checks the parts of portfolio v2 that need no accounts: the order replay plan, and a free model on
# GitHub Models writing the weekly summary, with the number guard on its output.
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb pandas openpyxl pyarrow
      - uses: actions/cache@v4
        with:
          path: data/raw/retail
          key: retail-raw-v1
      - run: python pipelines/retail/extract.py
      - name: Models on offer (free tier)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -s -i -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://models.github.ai/catalog/models | head -c 3000 | tee models.txt; echo
          curl -s -i -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say OK"}]}' | head -c 2000 | tee -a models.txt
      - name: Free model writes the summary; the number guard checks it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trial
          curl -sf https://ahmedkkassem.github.io/data-portfolio/data/report_week.json -o trial/facts.json
          python pipelines/summary/generate_free.py trial/facts.json trial/summary.json | tee trial/generate.txt
          GUARD_FACTS=trial/facts.json GUARD_SUMMARY=trial/summary.json GUARD_OUT=trial/guard.json \
            python checks/number_guard.py | tee trial/guard.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-trial
          path: |
            replay.txt
            models.txt
            build/shop/
            trial/
