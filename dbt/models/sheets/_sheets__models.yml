version: 2
sources:
  - name: sheets
    description: Output of pipelines/spreadsheets/clean.py (three messy team files rebuilt as one table).
    meta:
      external_location: "data/clean/{name}.parquet"
    tables:
      - name: sheets_clean
models:
  - name: stg_sheets__lines
    config:
      tags: [sheets]
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [invoice, line]
    columns:
      - name: invoice
        data_tests: [not_null]
      - name: stock_code
        data_tests: [not_null]
      - name: invoiced_at
        data_tests: [not_null]
  - name: mart_sheets_reconciliation
    config:
      tags: [sheets]
